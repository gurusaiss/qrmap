name: CI

# Blocking gate per docs/08-V1-IMPLEMENTATION-PLAN.md Phase 1: typecheck, lint,
# unit/integration tests (including the tenant-isolation and AI-security
# suites), and a production build. All run against a REAL Postgres instance
# with RLS, not mocks - the isolation suite has no meaning otherwise.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      # CI uses a single postgres superuser for setup only; app/system roles
      # below are created with the same NOSUPERUSER/NOBYPASSRLS constraints as
      # production (see docs/04-DATABASE.md §6) so RLS is genuinely exercised.
      DATABASE_URL_OWNER: postgres://mdp_owner:ownerpass@localhost:5432/mdp_ci
      DATABASE_URL: postgres://mdp_app:apppass@localhost:5432/mdp_ci
      DATABASE_URL_SYSTEM: postgres://mdp_system:systempass@localhost:5432/mdp_ci
      APP_URL: http://localhost:3000
      PUBLIC_QR_ORIGIN: http://localhost:3000
      SESSION_SECRET: ci-session-secret-at-least-32-bytes-long
      ANALYTICS_SALT_SECRET: ci-analytics-salt-secret-32-bytes
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /tmp/uploads-ci
      AI_PROVIDER: none
      SMS_DRIVER: console

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Provision database roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "
            CREATE ROLE mdp_owner LOGIN PASSWORD 'ownerpass' NOSUPERUSER NOCREATEDB NOCREATEROLE;
            CREATE ROLE mdp_app   LOGIN PASSWORD 'apppass'   NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            CREATE ROLE mdp_system LOGIN PASSWORD 'systempass' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            CREATE DATABASE mdp_ci OWNER mdp_owner;
          "
          PGPASSWORD=postgres psql -h localhost -U postgres -d mdp_ci -c "
            ALTER SCHEMA public OWNER TO mdp_owner;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
          "

      - name: Run migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests (incl. tenant isolation & AI security)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Fail if the public page regains framework JS
        # Regression guard for the fix in docs/12-KNOWN-ISSUES.md: the public
        # page must stay a Route Handler, never silently become a React page
        # again (which measurably cost ~174KB gzipped JS - see that doc).
        run: |
          if [ -f ".next/server/app/(public)/m/[slug]/page.js" ]; then
            echo "::error::app/(public)/m/[slug]/page.tsx exists again - the public page must stay a Route Handler (route.ts), not a React page. See docs/12-KNOWN-ISSUES.md."
            exit 1
          fi
